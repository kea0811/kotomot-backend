version: '3.8'

services:
  zeusx-koto-backend:
    build: .
    container_name: zeusx-koto-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - MONGODB_URI=mongodb://mongodb:27017/koto
      - MONGODB_DB=koto
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - FRONTEND_URL=${FRONTEND_URL:-https://koto.vercel.app}
      - NODE_ENV=production
    networks:
      - zeusx-network

networks:
  zeusx-network:
    external: true
